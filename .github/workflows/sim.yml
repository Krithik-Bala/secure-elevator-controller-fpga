name: simulate

on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Lift controller (rtl/lift_ctrl.v)
        run: |
          iverilog -g2012 -o lift.vvp rtl/lift_ctrl.v tb/tb_lift_ctrl.v
          vvp lift.vvp | tee lift.log
          grep -q "ALL TESTS PASSED" lift.log
      - name: Lab version (lab/el.v)
        run: |
          iverilog -g2012 -o el.vvp lab/el.v lab/tb_el.v
          vvp el.vvp | tee el.log
          grep -q "ALL TESTS PASSED" el.log
